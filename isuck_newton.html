<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prism Triangle</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --fg: rgba(255,255,255,.45);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #glow { filter: blur(7px) saturate(1.2); }
  p {
    position: fixed; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    margin: 0; text-align: center; color: var(--fg);
    font: 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .04em;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="glow"></canvas>
<canvas id="prism"></canvas>
<p>Move your cursor</p>
<script>
const cvA = document.getElementById('glow'), cvB = document.getElementById('prism');
const A = cvA.getContext('2d'), B = cvB.getContext('2d');
let W, H, dpr;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [cvA, cvB]) { c.width = W * dpr; c.height = H * dpr; }
  A.setTransform(dpr, 0, 0, dpr, 0, 0);
  B.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

// pointer state (target + smoothed)
let tx = innerWidth * 0.5, ty = innerHeight * 0.5, sx = tx, sy = ty, lastMove = -1e9;
addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; lastMove = performance.now(); });

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pt = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) });
const HUES = [0, 28, 55, 130, 190, 235, 280];

function frame(now) {
  // idle drift when the cursor hasn't moved for a while
  if (now - lastMove > 3000) {
    const s = now / 1000;
    tx = W / 2 + Math.cos(s * 0.6) * W * 0.25;
    ty = H / 2 + Math.sin(s * 0.8) * H * 0.18;
  }
  sx = lerp(sx, tx, 0.08); sy = lerp(sy, ty, 0.08);

  // triangle geometry
  const h = Math.min(H * 0.52, W * 0.62 * 0.866), side = h / 0.866;
  const cx = W / 2, cy = H / 2 - 10;
  const top = { x: cx, y: cy - h / 2 };
  const bl = { x: cx - side / 2, y: cy + h / 2 };
  const br = { x: cx + side / 2, y: cy + h / 2 };

  // light path: enters left edge, refracts, exits right edge
  const t = clamp((sy - top.y) / h, 0.18, 0.82);
  const u = clamp(t + (sx / W - 0.5) * 0.3, 0.18, 0.82);
  const hit = pt(top, bl, t);
  const exit = pt(top, br, u);
  const src = { x: -30, y: hit.y + (0.5 - t) * h * 0.55 };
  const innerAng = Math.atan2(exit.y - hit.y, exit.x - hit.x);
  const base = innerAng + 0.16;
  const spread = 0.34 + Math.abs(sx / W - 0.5) * 0.35;
  const L = Math.max(W, H) * 1.3;

  // ---- glow layer (blurred via CSS) ----
  A.globalCompositeOperation = 'source-over';
  A.clearRect(0, 0, W, H);
  A.globalCompositeOperation = 'lighter';

  // incoming beam
  let g = A.createLinearGradient(src.x, src.y, hit.x, hit.y);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(255,255,255,.9)');
  A.strokeStyle = g;
  A.lineCap = 'round';
  A.lineWidth = 12; A.globalAlpha = .35;
  A.beginPath(); A.moveTo(src.x, src.y); A.lineTo(hit.x, hit.y); A.stroke();
  A.lineWidth = 3; A.globalAlpha = 1;
  A.beginPath(); A.moveTo(src.x, src.y); A.lineTo(hit.x, hit.y); A.stroke();

  // rainbow fan
  for (let i = 0; i < 7; i++) {
    const a0 = base + spread * (i / 7), a1 = base + spread * ((i + 1) / 7), am = (a0 + a1) / 2;
    const g2 = A.createLinearGradient(exit.x, exit.y, exit.x + Math.cos(am) * L, exit.y + Math.sin(am) * L);
    g2.addColorStop(0, `hsla(${HUES[i]},100%,60%,.85)`);
    g2.addColorStop(0.7, `hsla(${HUES[i]},100%,55%,.12)`);
    g2.addColorStop(1, `hsla(${HUES[i]},100%,55%,0)`);
    A.fillStyle = g2;
    A.beginPath();
    A.moveTo(exit.x, exit.y);
    A.lineTo(exit.x + Math.cos(a0) * L, exit.y + Math.sin(a0) * L);
    A.lineTo(exit.x + Math.cos(a1) * L, exit.y + Math.sin(a1) * L);
    A.closePath(); A.fill();
  }
  // glow at hit and exit points
  for (const p of [hit, exit]) {
    const r = A.createRadialGradient(p.x, p.y, 0, p.x, p.y, 60);
    r.addColorStop(0, 'rgba(255,255,255,.7)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    A.fillStyle = r; A.beginPath(); A.arc(p.x, p.y, 60, 0, 7); A.fill();
  }
  A.globalAlpha = 1;

  // ---- sharp layer: triangle ----
  B.clearRect(0, 0, W, H);
  const tri = () => { B.beginPath(); B.moveTo(top.x, top.y); B.lineTo(br.x, br.y); B.lineTo(bl.x, bl.y); B.closePath(); };

  tri();
  const fill = B.createLinearGradient(0, top.y, 0, bl.y);
  fill.addColorStop(0, '#16161a'); fill.addColorStop(1, '#050506');
  B.fillStyle = fill; B.fill();

  B.save(); tri(); B.clip();
  // cursor-following sheen
  const sheen = B.createRadialGradient(sx, sy, 0, sx, sy, side * 0.55);
  sheen.addColorStop(0, 'rgba(255,255,255,.14)'); sheen.addColorStop(1, 'rgba(255,255,255,0)');
  B.fillStyle = sheen; B.fillRect(0, 0, W, H);
  // beam inside the glass
  const ig = B.createLinearGradient(hit.x, hit.y, exit.x, exit.y);
  ig.addColorStop(0, 'rgba(255,255,255,.95)'); ig.addColorStop(1, 'rgba(255,255,255,.35)');
  B.strokeStyle = ig; B.lineCap = 'round';
  B.globalAlpha = .25; B.lineWidth = 14;
  B.beginPath(); B.moveTo(hit.x, hit.y); B.lineTo(exit.x, exit.y); B.stroke();
  B.globalAlpha = 1; B.lineWidth = 3;
  B.beginPath(); B.moveTo(hit.x, hit.y); B.lineTo(exit.x, exit.y); B.stroke();
  B.restore();

  // edges lit by cursor
  const eg = B.createRadialGradient(sx, sy, 0, sx, sy, side * 0.7);
  eg.addColorStop(0, 'rgba(255,255,255,.95)'); eg.addColorStop(1, 'rgba(255,255,255,.14)');
  B.strokeStyle = eg; B.lineWidth = 1.5; B.lineJoin = 'round';
  tri(); B.stroke();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
